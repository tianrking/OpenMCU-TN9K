name: OpenMCU CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install RTL simulator
        run: sudo apt-get update && sudo apt-get install --yes iverilog
      - name: Check generated SDK register definitions
        shell: pwsh
        run: ./scripts/generate-sdk.ps1 -Check
      - name: Check Tang Nano 9K project source coverage
        shell: pwsh
        run: ./scripts/check-tangnano9k-project.ps1
      - name: Check Tang Nano 9K MCU product project source coverage
        shell: pwsh
        run: ./scripts/check-tangnano9k-project.ps1 -McuMode
      - name: Run portable, product and Tang bring-up RTL smoke tests
        shell: pwsh
        run: |
          ./scripts/run-rtl-smoke.ps1 -Test gpio
          ./scripts/run-rtl-smoke.ps1 -Test timer
          ./scripts/run-rtl-smoke.ps1 -Test uart
          ./scripts/run-rtl-smoke.ps1 -Test spi
          ./scripts/run-rtl-smoke.ps1 -Test i2c
          ./scripts/run-rtl-smoke.ps1 -Test wdt
          ./scripts/run-rtl-smoke.ps1 -Test pwm
          ./scripts/run-rtl-smoke.ps1 -Test irqctrl
          ./scripts/run-rtl-smoke.ps1 -Test sysctrl
          ./scripts/run-rtl-smoke.ps1 -Test user-flash
          ./scripts/run-rtl-smoke.ps1 -Test system
          ./scripts/run-rtl-smoke.ps1 -Test system-uart
          ./scripts/run-rtl-smoke.ps1 -Test mcu-top
          ./scripts/run-rtl-smoke.ps1 -Test tn9k

  sdk:
    runs-on: ubuntu-latest
    env:
      XPACKS_STORE_FOLDER: ${{ github.workspace }}/.xpack-store
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install RTL simulator and host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build iverilog
      - name: Install pinned xPack RISC-V toolchain
        shell: pwsh
        run: |
          $xpmWork = Join-Path $env:RUNNER_TEMP 'omcu-xpm-sdk'
          New-Item -ItemType Directory -Force -Path $xpmWork | Out-Null
          Push-Location $xpmWork
          try {
            npm install --no-save xpm@0.23.2
            $xpmPath = Join-Path $xpmWork 'node_modules/.bin/xpm'
            & $xpmPath init --name omcu-ci-sdk
            if ($LASTEXITCODE -ne 0) { throw "xpm init failed with exit code $LASTEXITCODE" }
            & $xpmPath install '@xpack-dev-tools/riscv-none-elf-gcc@15.2.0-1.1' --verbose
            if ($LASTEXITCODE -ne 0) { throw "xpm toolchain install failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $compilerPath = Join-Path $xpmWork 'xpacks/.bin/riscv-none-elf-gcc'
          if (-not (Test-Path -LiteralPath $compilerPath -PathType Leaf)) {
            throw "xPack did not provide $compilerPath"
          }
          (Get-Item -LiteralPath $compilerPath).DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build RV32IMC firmware through the POSIX SDK entry point
        run: sh ./scripts/build-sdk.sh --riscv-prefix riscv-none-elf-
      - name: Execute compiled RV32IMC SDK firmware in SoC simulation
        shell: pwsh
        run: |
          ./scripts/run-rtl-smoke.ps1 -Test sdk-isa
          ./scripts/run-rtl-smoke.ps1 -Test sdk-peripherals
          ./scripts/run-rtl-smoke.ps1 -Test sdk-i2c
          ./scripts/run-rtl-smoke.ps1 -Test sdk-irq
          ./scripts/run-rtl-smoke.ps1 -Test tn9k-wdt
          ./scripts/run-rtl-smoke.ps1 -Test tn9k-peripherals

  sdk-cross-platform:
    name: SDK host build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      # Keep the package store inside the disposable CI workspace, then locate
      # the compiler by executable name instead of hard-coding OS-specific
      # xPack home-directory locations.
      XPACKS_STORE_FOLDER: ${{ github.workspace }}/.xpack-store
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned xPack GNU RISC-V toolchain and build all SDK examples
        shell: pwsh
        run: |
          cmake --version
          ninja --version

          $xpmWork = Join-Path $env:RUNNER_TEMP 'omcu-xpm'
          New-Item -ItemType Directory -Force -Path $xpmWork | Out-Null
          Push-Location $xpmWork
          try {
            npm install --no-save xpm@0.23.2
            $xpmName = if ($IsWindows) { 'xpm.cmd' } else { 'xpm' }
            $xpmPath = Join-Path $xpmWork (Join-Path 'node_modules/.bin' $xpmName)
            & $xpmPath init --name omcu-ci-xpack
            if ($LASTEXITCODE -ne 0) { throw "xpm init failed with exit code $LASTEXITCODE" }
            & $xpmPath install '@xpack-dev-tools/riscv-none-elf-gcc@15.2.0-1.1' --verbose
            if ($LASTEXITCODE -ne 0) { throw "xpm toolchain install failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $compilerName = if ($IsWindows) { 'riscv-none-elf-gcc.exe' } else { 'riscv-none-elf-gcc' }
          # xpm creates a project-local launcher for every installed xPack.
          # Use it first: on macOS, the central-store payload lives below the
          # hidden .content directory, which PowerShell does not recurse into
          # unless -Force is specified.
          $compilerPath = Join-Path $xpmWork (Join-Path 'xpacks/.bin' $compilerName)
          if (Test-Path -LiteralPath $compilerPath -PathType Leaf) {
            $compiler = Get-Item -LiteralPath $compilerPath
          } else {
            $compiler = Get-ChildItem -LiteralPath $env:XPACKS_STORE_FOLDER -Recurse -Force -File -Filter $compilerName |
              Select-Object -First 1
          }
          if ($null -eq $compiler) {
            throw "xPack did not provide $compilerName below $env:XPACKS_STORE_FOLDER"
          }
          $env:PATH = "$($compiler.DirectoryName)$([IO.Path]::PathSeparator)$env:PATH"
          & $compiler.FullName --version

          if ($IsWindows) {
            ./scripts/build-sdk.ps1 -BuildDirectory build/sdk-host -RiscvPrefix riscv-none-elf-
          } else {
            sh ./scripts/build-sdk.sh --build-dir build/sdk-host --riscv-prefix riscv-none-elf-
          }
